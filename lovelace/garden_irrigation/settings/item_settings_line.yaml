# lovelace_gen

#====================================================
#=== SETTINGS LINE
#===
#=== Used for standard lines in the Settings section
#===
#=== entity: The entity_id being displayed
#=== Optional:
#===  name:  Name to be used
#===  icon:  Icon to be displayed
#===  label: Secondary info text
#===  unit:  Unit of Measurement
#===  round: Number of decimals to display
#====================================================
type: custom:button-card
entity: {{ entity }}
triggers_update:
  - binary_sensor.irrigation_temperature_data_ready
  - binary_sensor.irrigation_rainfall_data_ready
show_state: true
state_display: >
  [[[
    var temperature_history = /^input_number\.irrigation_(high_temp_[1-4]|temperature_highest_(actual_temp|forecast_high_temp)_today)$/.test(entity.entity_id);
    if (temperature_history && states['binary_sensor.irrigation_temperature_data_ready']?.attributes.valid?.[entity.entity_id] !== true)
      return '—';
    var rainfall_data = /^input_number\.irrigation_rainfall_[2-4]$|^sensor\.irrigation_sensor_rainfall_/.test(entity.entity_id);
    if (rainfall_data && states['binary_sensor.irrigation_rainfall_data_ready']?.attributes.valid?.[entity.entity_id] !== true)
      return '—';
    var unit = '{{ unit | default('') }}';
    var round = '{{ round | default('') }}';
    var unit_om = entity.attributes.unit_of_measurement ? entity.attributes.unit_of_measurement : '';
    var statestr = entity.state;

    if (isNaN(statestr))
      return statestr;
    else if(unit.length > 0)
      return parseFloat(statestr).toFixed(round) + ' ' + unit;
    else
      return parseFloat(statestr).toFixed(round) + ' ' + unit_om;
  ]]]
name: {{ name | default('') }}
icon: {{ icon | default('') }}
show_label: true
label: {{ label | default('') }}
size: 30%
styles:
  grid:
    - grid-template-areas: >
        [[[
          if ('{{ label | default('') }}' == '')
            return '"i n s"  "i n s"';
          else
            return '"i n s"  "i l s"';
        ]]]
    - grid-template-columns: 12% minmax(0, 1fr) 22%
    - grid-template-rows: min-content min-content
  card:
    - font-family: >
        [[[
          return states['input_text.irrigation_ui_font_family'].state
        ]]]
    - font-size: 15px
    - padding: {{ padding | default('0em 0em 0em 0em') }}
    - background: none
  icon:
    - color: var(--state-icon-color)
  name: 
    - white-space: normal
    - text-overflow: unset
    - overflow-wrap: anywhere
    - text-align: left
    - justify-self: start
  label:
    - white-space: normal
    - text-overflow: unset
    - overflow-wrap: anywhere
    - text-align: left
    - justify-self: start
    - color: var(--secondary-text-color)
  state:
    - white-space: normal
    - overflow-wrap: anywhere
state:
  - value: unavailable
    styles:
      icon:
        - color: var(--accent-color)
        - animation: blink 2s ease infinite
      state:
        - color: var(--accent-color)
        - animation: blink 2s ease infinite

#=== ALLOW ENTITY TO BE EDITED
#=== (Allows 'none' to be passed in)
tap_action:
  action: {{ tap_action | default('fire-dom-event') }}
  browser_mod:
    service: browser_mod.popup
    data:
      title: {{ name | default('') }}
      content:
        type: entities
        entities:
          - entity: {{ entity }}
            name: {{ name | default('') }}
            icon: {{ icon | default('') }}
            card_mod:
              style: # Wrap text
                hui-generic-entity-row:
                  $: |
                    .info {
                      text-overflow: unset !important;
                      white-space: unset !important;
                    }
        card_mod:
          style: >
            ha-card {
              font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
            }
      #=== Style needed for pop-up title
      style:
        $: |
          .mdc-dialog .mdc-dialog__container .mdc-dialog__surface {
              font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
            }
    
