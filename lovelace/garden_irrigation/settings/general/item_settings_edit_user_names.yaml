# lovelace_gen
type: conditional
conditions:
  - condition: state
    entity: script.irrigation_notify
    state_not: [unknown, unavailable]
card:
  #==============================
  #=== BUTTON TO EDIT USER NAMES
  #==============================
  type: horizontal-stack
  cards:
    - type: custom:button-card
      color_type: blank-card

    - type: custom:button-card
      color_type: blank-card

    - type: custom:button-card
      name: "•  Notifications and optional features "
      icon: mdi:square-edit-outline
      size: 60%
      styles:
        grid:
          - grid-template-areas: '"n i"'
          - grid-template-columns: 1fr 20%
          - grid-template-rows: min-content
        card:
          - font-family: >
              [[[
                return states['input_text.irrigation_ui_font_family'].state
              ]]]
          - font-size: 12px
          - padding: 0em 0.2em 0em
          - margin-top: 0em
        name:
          - color: var(--secondary-text-color)
          - justify-self: right
    
      #=== EDIT USER NAMES
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Notifications and optional features
            content:
              type: vertical-stack
              cards:
                - type: markdown
                  content: >
                    Choose the name of up to two users to receive notifications about
                    irrigation events.
                  card_mod:
                    style: >
                      ha-card {
                        font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
                        font-size: 16px;
                      }
                - type: entities
                  entities:
                    - entity: input_text.irrigation_notification_user1_name
                      name: User 1
                    - entity: input_text.irrigation_notification_user2_name
                      name: User 2
                    - entity: input_text.irrigation_notification_script
                      name: Notification script
                    - entity: input_text.irrigation_log_notify_entity
                      name: File notification entity
                    - entity: input_text.irrigation_announcement_script
                      name: Announcement script
                    - entity: input_text.irrigation_announcement_player
                      name: Announcement media player
                    - entity: input_text.irrigation_startup_ready_entity
                      name: Optional startup-ready entity
                    - entity: input_text.irrigation_ha_stopping_entity
                      name: Optional shutdown entity
                    - entity: input_text.irrigation_external_sensor_weather_outlook
                      name: Weather outlook entity
                  card_mod:
                    style: >
                      ha-card {
                        font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
                      }
                - type: markdown
                  content: >
                    These names are held in:
                  card_mod:
                    style: >
                      ha-card {
                        font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
                        font-size: 16px;
                      }
                - type: markdown
                  content: >
                    input_text.irrigation_notification_user[1, 2]_name
                  card_mod:
                    style: >
                      ha-card {
                        font-family: Monospace;
                        font-size: 14px;
                        text-align: center;
                      }
                - type: markdown
                  content: >
                    and can be used in your own notification processing as approriate.


                    Set an existing notification script above to enable optional delivery.


                    Unconfigured optional features are skipped. No messages are sent until a destination is configured.
                  card_mod:
                    style: >
                      ha-card {
                        font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
                            font-size: 16px;
                      }
            #=== Style needed for pop-up title
            style:
              $: |
                .mdc-dialog .mdc-dialog__container .mdc-dialog__surface {
                    font-family: {% raw %}{{ states('input_text.irrigation_ui_font_family') }}{% endraw %};
                  }
      
