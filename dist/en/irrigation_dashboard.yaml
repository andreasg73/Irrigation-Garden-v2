                          ---


                          ### 🌡️ Temperature multiplier

                          This multiplier will increase or decrease watering time proportionally based on the difference
                          between the temperature threshold and the  average high temperature over the last few
                          days.


                          It is calculated as High Temperature divided by Baseline Temperature.


                          For example, if the baseline temperature is set to 25 degrees and the average temperature
                          has been 30 degrees the adjustment will be plus 20%.


                          Likewise if the average temperature has only been 20 degrees the adjustment will be minus
