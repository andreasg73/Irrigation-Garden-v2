                          \ + duration %}\n      {% endif %}\n      {% if is_state('input_boolean.irrigation_' ~\
                          \ cycle ~ '_' ~ zone ~ '_tue', 'on' ) %}\n        {% set ns.duration_tue = ns.duration_tue\
