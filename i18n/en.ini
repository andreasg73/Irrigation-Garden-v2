settings_for_all_controllers_you_can_decide_how_long_to_wait__47f60659 = "### Settings for all controllers.\nYou can decide how long to wait if a controller is offline."
rain_multiplier_this_multiplier_will_decrease_watering_time___6d9c77e5 = "### 🌧️ Rain multiplier\nThis multiplier will decrease watering time proportionally based on the difference between the rainfall threshold and the amount of rain over the last few days.\n\nIf the threshold is reached then it will stop it altogether.\n\n---\n\n### 🌡️ Temperature multiplier\nThis multiplier will increase or decrease watering time proportionally based on the difference between the temperature threshold and the  average high temperature over the last few days.\n\nIt is calculated as High Temperature divided by Baseline Temperature.\n\nFor example, if the baseline temperature is set to 25 degrees and the average temperature has been 30 degrees the adjustment will be plus 20%.\n\nLikewise if the average temperature has only been 20 degrees the adjustment will be minus 20%."
