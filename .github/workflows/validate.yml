name: Validate sources and translations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_i18n_release.py --language en --output dist/en
      - run: python tools/build_i18n_release.py --language pl --output dist/pl
      - run: python tools/test_localization.py
      - run: node tools/test_localization_js.cjs
      - run: python tools/check_publication.py
      - run: python tools/build_hacs_bundle.py
      - run: git diff --exit-code -- custom_components/irrigation_garden/bundle.zip
  installer-ha-2026-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python homeassistant==2026.10.2 pytest pytest-asyncio
      # HA installs optional integration requirements through uv subprocesses;
      # activate the environment so those subprocesses target the same Python.
      - run: |
          source .venv/bin/activate
          python -m pytest tests/hacs -q
  ui-dom-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix "$RUNNER_TEMP/ig-ui-deps" happy-dom@21.0.4
      - run: NODE_PATH="$RUNNER_TEMP/ig-ui-deps/node_modules" node tools/test_ui_dom.cjs
