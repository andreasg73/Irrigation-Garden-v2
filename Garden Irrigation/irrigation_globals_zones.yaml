# ============================================================
# Zone activity mirrors for history_stats (HA 2026).
# Native history_stats requires a static entity_id; these
# virtual sensors follow the zone's user-selected switch.
# No service calls or physical switching occur here.
# ============================================================
template:
  - binary_sensor:
      - name: Irrigation Zone1 Activity
        unique_id: irrigation_zone1_activity
        state: >
          {% set active = is_state('input_text.irrigation_active_zone','zone1') %}
          {% set output = states('input_text.irrigation_active_switch') if active and states('input_text.irrigation_active_switch').startswith('switch.') else states('input_text.irrigation_zone1_switch_entity_id') %}
          {{ is_state(output,'on') }}
        availability: >
          {% set active = is_state('input_text.irrigation_active_zone','zone1') %}
          {% set output = states('input_text.irrigation_active_switch') if active and states('input_text.irrigation_active_switch').startswith('switch.') else states('input_text.irrigation_zone1_switch_entity_id') %}
          {{ output.startswith('switch.') and states(output) in ['on','off'] }}

      - name: Irrigation Zone2 Activity
