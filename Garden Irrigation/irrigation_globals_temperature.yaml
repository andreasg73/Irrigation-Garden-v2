
#==============
#=== Templates
#==============
template:
  - sensor:

      #=========================================================
      #=== Internal sensors that are based on the external ones
      #=== that have been user defined in the input texts.
      #===
      #=== These sensors are synchronised manually in an
      #=== automation when the external ones change
      #=========================================================
      - name: Irrigation Sensor Forecast High Temp
        unique_id: irrigation_sensor_forecast_high_temp
        state: >
          {% set sensor_name = states('input_text.irrigation_external_sensor_forecast_high_temp') %}
          {{ states(sensor_name) }}
        availability: >
          {% set sensor_name = states('input_text.irrigation_external_sensor_forecast_high_temp') %}
          {{ is_number(states(sensor_name)) and state_attr(sensor_name, 'unit_of_measurement') in [none, '', '°C'] and -60 <= states(sensor_name) | float(-999) <= 70 }}
        icon: mdi:thermometer-high
        unit_of_measurement: '°C'
        device_class: temperature

      - name: Irrigation Sensor Current Temp
        unique_id: irrigation_sensor_current_temp
        state: >
          {% set sensor_name = states('input_text.irrigation_external_sensor_current_temp') %}
          {{ states(sensor_name) }}
        availability: >
          {% set sensor_name = states('input_text.irrigation_external_sensor_current_temp') %}
          {{ is_number(states(sensor_name)) and state_attr(sensor_name, 'unit_of_measurement') in [none, '', '°C'] and -60 <= states(sensor_name) | float(-999) <= 70 }}
        icon: mdi:thermometer-low
        unit_of_measurement: '°C'
        device_class: temperature

  - binary_sensor:
    - name: Irrigation Temperature Data Ready
      unique_id: irrigation_temperature_data_ready
      state: >-
        {% set records = states('input_text.irrigation_temperature_daily_records') | from_json([]) %}

        {% set ns = namespace(valid={}) %}

        {% for day in range(5) %}
          {% set date = (now() - timedelta(days=day)).date().isoformat() %}
          {% set matches = records | selectattr('0','eq',date) | list if records is sequence and records is not string
        and records is not mapping else [] %}
          {% set row = matches[0] if matches | length > 0 else [] %}
          {% set fields = [['input_number.irrigation_temperature_highest_actual_temp_today',1], ['input_number.irrigation_temperature_highest_forecast_high_temp_today',2]]
        if day == 0 else [['input_number.irrigation_high_temp_' ~ day,1]] %}
          {% for entity, index in fields %}
            {% set value = row[index] if row | length == 3 else none %}
            {% set ok = is_number(value) and is_number(states(entity)) and states(entity) | float(0) == value | float(0)
        %}
            {% set ns.valid = dict(ns.valid, **{entity: ok}) %}
          {% endfor %}
        {% endfor %}

        {% set option = states('input_select.irrigation_high_temp_options') %}

        {% set days = states('input_number.irrigation_days_of_temp_history_used') %}

        {% set baseline = states('input_number.irrigation_temperature_baseline') %}

        {% set current = ['input_number.irrigation_temperature_highest_forecast_high_temp_today'] if option == 'Use
        Forecast' else ['input_number.irrigation_temperature_highest_actual_temp_today'] if option == 'Use Actual'
        else ['input_number.irrigation_temperature_highest_actual_temp_today','input_number.irrigation_temperature_highest_forecast_high_temp_today']
        %}

        {% set check = namespace(ready=option in ['Use Forecast','Use Actual','Use Highest'] and is_number(days) and
        is_number(baseline)) %}

        {% for entity in current %}{% if not ns.valid.get(entity,false) %}{% set check.ready=false %}{% endif %}{%
        endfor %}

        {% for n in range(1,(days | int(0))+1) %}{% if not ns.valid.get('input_number.irrigation_high_temp_' ~ n,false)
        %}{% set check.ready=false %}{% endif %}{% endfor %}

        {{ check.ready }}
      attributes:
        valid: >-
          {% set records = states('input_text.irrigation_temperature_daily_records') | from_json([]) %}

          {% set ns = namespace(valid={}) %}

          {% for day in range(5) %}
            {% set date = (now() - timedelta(days=day)).date().isoformat() %}
            {% set matches = records | selectattr('0','eq',date) | list if records is sequence and records is not
          string and records is not mapping else [] %}
            {% set row = matches[0] if matches | length > 0 else [] %}
            {% set fields = [['input_number.irrigation_temperature_highest_actual_temp_today',1], ['input_number.irrigation_temperature_highest_forecast_high_temp_today',2]]
          if day == 0 else [['input_number.irrigation_high_temp_' ~ day,1]] %}
            {% for entity, index in fields %}
              {% set value = row[index] if row | length == 3 else none %}
              {% set ok = is_number(value) and is_number(states(entity)) and states(entity) | float(0) == value |
          float(0) %}
              {% set ns.valid = dict(ns.valid, **{entity: ok}) %}
            {% endfor %}
          {% endfor %}

          {{ ns.valid }}
        date: '{{ now().date().isoformat() }}'


#================
#=== Input Texts
#================
input_text:
  # Compact dated maxima: today plus four prior calendar days; restored by HA.
  irrigation_temperature_daily_records:
    name: Irrigation Temperature Daily Records
    max: 255

  #==============================
  #=== User defined sensor names
  #==============================
  #=== Sensor for forecast high temperature
  irrigation_external_sensor_forecast_high_temp:
    name: Forecast High Temperature Sensor
    icon: mdi:thermometer-high
    min: 0
    max: 100

  #=== Sensor for current temperature
  irrigation_external_sensor_current_temp:
    name: Current Temperature Sensor
    icon: mdi:thermometer-lines
    min: 0
    max: 100


#==================
#=== Input_Numbers
#==================
input_number:

  #=== Temperature multiplier
  irrigation_temp_multiplier:
    name: multiplier for temperature
    min: 0
    max: 10
    step: 0.01
    icon: mdi:thermometer

  #=== Temperature Days To Use
  irrigation_days_of_temp_history_used:
    name: Number of days history to use in calculations
    min: 0
    max: 4
    step: 1
    mode: box
    icon: mdi:calendar-range

  #=== The temperature above or below which the duration is adjusted
  irrigation_temperature_baseline:
    name: Temperature baseline
    min: 20
    max: 50
    step: 1
    icon: mdi:thermometer-low
    mode: box
    unit_of_measurement: '°C'


  #=== Highest Actual Temperature Today
  irrigation_temperature_highest_actual_temp_today:
    name: Highest Actual Temperature Today
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer
    unit_of_measurement: '°C'
  

  #=== Highest Forecast High Temperature Today
  irrigation_temperature_highest_forecast_high_temp_today:
    name: Highest Forecast High Temperature Today
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer
    unit_of_measurement: '°C'
  

  #=== Temperature History
  irrigation_high_temp_1:
    name: Yesterday
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer-high
    unit_of_measurement: '°C'

  irrigation_high_temp_2:
    name: Two days ago
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer-high
    unit_of_measurement: '°C'

  irrigation_high_temp_3:
    name: Three days ago
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer-high
    unit_of_measurement: '°C'

  irrigation_high_temp_4:
    name: Four days ago
    min: -60
    max: 70
    step: 0.1
    icon: mdi:thermometer-high
    unit_of_measurement: '°C'


#==================
#=== Input Selects
#==================
input_select:

  irrigation_high_temp_options:
    name: High Temperature Options
    options: 
      - Use Forecast
      - Use Actual
      - Use Highest
    icon: mdi:thermometer-lines

# Retained until a valid first sample arrives after a midnight source outage.
input_boolean:
  irrigation_temperature_actual_reset_pending:
    name: Irrigation Actual Temperature Reset Pending
  irrigation_temperature_forecast_reset_pending:
    name: Irrigation Forecast Temperature Reset Pending
