
#==================
#=== Input Numbers
#==================
input_number:
  irrigation_controller_log_unavailable_seconds_threshold:
    name: Unavailable Seconds Threshold
    min: 0
    max: 30
    icon: mdi:lightbulb-alert


# #====================
# #=== Input Datetimes
# #====================
# input_datetime:
#   irrigation_controller_time_became_unavailable:
#     has_date: true
#     has_time: true


#================
#=== Automations
#================
automation:
  #======================================
  #=== Irrigation Controller Unavailable
  #======================================
  - alias: Irrigation Warning Controller Unavailable
    id: irrigation_warning_controller_unavailable
    mode: queued

    trigger:
      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        from: 'on'
        to: 'off'
        for:
          seconds: "{{ states('input_number.irrigation_controller_log_unavailable_seconds_threshold') | int(0) }}"

    condition:
      #=== Don't run if HA is shutting down as that causes false positives
      - condition: template
        value_template: "{{ not is_state('input_boolean.system_ha_stopping','on') }}"

      #=== Only run if HA start delay is complete
      - condition: template
        value_template: "{{ states('binary_sensor.system_ha_start_delay_complete') in ['on','unknown'] }}"

    action:
      # #=== Update the time controller became Unavailable
      # - service: input_datetime.set_datetime
      #   target:
      #     entity_id: input_datetime.irrigation_controller_time_became_unavailable
      #   data:
      #     timestamp: >
      #       {{ now().timestamp() }}

      #=== Write To Log
      - action: script.turn_on
        entity_id: script.irrigation_write_to_log
        data:
          variables:
            log_event: CONTROLLER_UNAVAILABLE
            event_time: >
              {{ now() }}

      #=== Persistent Notification
      - if:
          - condition: template
            value_template: "{{ has_value('script.notify') and is_state('input_boolean.irrigation_ha_notify_of_controller_wifi_events','on') }}"
        then:
          - action: script.notify
            data:
              show: true
              title: ⚠️ Irrigation Warning ⚠️
              message: >
                Irrigation Controller is UNAVAILABLE

                At: {{ now().isoformat() }}
              # notification_id: CONTROLLER_UNAVAILABLE

      #=== Notify
      - if:
          - condition: state
            entity_id: input_boolean.irrigation_notify_user1
            state: 'on'
          - condition: state
            entity_id: input_boolean.irrigation_user_notify_of_controller_wifi_events
            state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.notify') }}"
            then:
              - action: script.notify
                data:
                  tell: >
                    {{ states('input_text.notifications_user1_name') }}
                  type: app_notification
                  title: ⚠️ Irrigation Warning ⚠️
                  message: >
                    Irrigation Controller is UNAVAILABLE

                    At: {{ now().isoformat() }}
                  mobile_app_tag: CONTROLLER_UNAVAILABLE

      - if:
          - condition: state
            entity_id: input_boolean.irrigation_notify_user2
            state: 'on'
          - condition: state
            entity_id: input_boolean.irrigation_user_notify_of_controller_wifi_events
            state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.notify') }}"
            then:
              - action: script.notify
                data:
                  tell: >
                    {{ states('input_text.notifications_user2_name') }}
                  type: app_notification
                  title: ⚠️ Irrigation Warning ⚠️
                  message: >
                    Irrigation Controller is UNAVAILABLE

                    At: {{ now().isoformat() }}
                  mobile_app_tag: CONTROLLER_UNAVAILABLE


  #====================================
  #=== Irrigation Controller Available
  #====================================
  - alias: Irrigation Warning Controller Available
    id: irrigation_warning_controller_available
    mode: queued

    trigger:
      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        from: 'off'
        to: 'on'

    variables:
      controller_offline_for: >
        {% set unavailable_at = state_attr('automation.irrigation_warning_controller_unavailable', 'last_triggered') %}
        {% if unavailable_at is not none %}
          {{ timedelta(seconds=([as_timestamp(now()) - as_timestamp(unavailable_at, 0), 0] | max) | int(0)) }}
        {% else %}
          unknown
        {% endif %}

    condition:
      #=== Only run if HA start delay is complete
      - condition: template
        value_template: "{{ states('binary_sensor.system_ha_start_delay_complete') in ['on','unknown'] }}"

    action:
      #=== Write To Log
      - action: script.turn_on
        entity_id: script.irrigation_write_to_log
        data:
          variables:
            log_event: CONTROLLER_AVAILABLE
            event_time: >
              {{ now() }}
            controller_offline_for: >
              {{ controller_offline_for }}
            # unavailable_seconds: >
            #   {{ (as_timestamp(now()) - state_attr('input_datetime.irrigation_controller_time_became_unavailable', 'timestamp')) | round }}

      #=== Persistent Notification
      - if:
          - condition: template
            value_template: "{{ has_value('script.notify') and is_state('input_boolean.irrigation_ha_notify_of_controller_wifi_events','on') }}"
        then:
          - action: script.notify
            data:
              show: true
              title: ⚠️ Irrigation Warning ⚠️
              message: >
                Irrigation Controller is now AVAILABLE (after {{ controller_offline_for }})

                At: {{ now().isoformat() }}

              # message: >
              #   {% set unavailable_seconds = (as_timestamp(now()) - state_attr('input_datetime.irrigation_controller_time_became_unavailable', 'timestamp')) | round %}
              #   {% set unavailable_formatted = (timedelta(seconds = unavailable_seconds)) %}

              #   Irrigation Controller is now AVAILABLE (after {{ unavailable_formatted }})

              #   At: {{ now().isoformat() }}


