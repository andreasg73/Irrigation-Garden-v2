
#============
#=== Scripts
#============
script:
  
  #============================
  #=== Irrigation Write To Log
  #============================
  irrigation_write_to_log:
    alias: Irrigation Write To Log
    mode: queued
    sequence:

      - condition: state
        entity_id: input_boolean.logging_irrigation
        state: 'on'

      # File notifications are configured separately through HA's File integration.
      - condition: template
        value_template: "{{ states('input_text.irrigation_log_notify_entity') in (states.notify | map(attribute='entity_id') | list) and has_value(states('input_text.irrigation_log_notify_entity')) }}"

      - variables:
          #=== Event Time With Millisceonds
          event_time: >
            {{ as_timestamp(event_time | default(now())) | timestamp_custom('%X.%f') }}

      - choose:
          #=== CONTROLLER_UNAVAILABLE
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CONTROLLER_UNAVAILABLE' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {{ event_time }} - WARNING - Controller UNAVAILABLE

          #=== CONTROLLER_AVAILABLE
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CONTROLLER_AVAILABLE' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set unavailable_formatted = controller_offline_for | default(timedelta(seconds=unavailable_seconds | default(0) | float(0))) %}
                    {{ event_time }} - WARNING - Controller AVAILABLE (after {{ unavailable_formatted }})

          #=== SINGLE ZONE STARTING
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'SINGLE_ZONE_STARTING' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set zone_name = states('input_text.irrigation_zone' ~ zone ~ '_name') %}
                    {{ event_time }} - Single zone starting - {{ zone }} ({{ zone_name }})

          #=== FAILSAFE_SET
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'FAILSAFE_SET' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set failsafe_time = states('input_number.irrigation_failsafe_time_in_seconds') %}
                    {{ event_time }} - failsafe time {{ failsafe_time }} seconds

          #=== CYCLE_WAITING_FOR_ENTITY
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_WAITING_FOR_ENTITY' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name = states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {% set wait_for_entity_name = states('input_text.irrigation_cycle' ~ cycle ~ '_wait_for_entity_name') %}
                    {% set wait_for_entity_state = states('input_text.irrigation_cycle' ~ cycle ~ '_wait_for_entity_state') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) WARNING! Waiting for entity
                    {{ '\n' }}{{ "{:>18}".format('') }}Entity: {{ wait_for_entity_name }}
                    {{ '\n' }}{{ "{:>18}".format('') }}Waiting for state:  {{ wait_for_entity_state }}
                    {{ '\n' }}{{ "{:>18}".format('') }}Current state:  {{ states(wait_for_entity_name) }}

          #=== CYCLE_WAITING_FOR_ENTITY_COMPLETE
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_WAITING_FOR_ENTITY_COMPLETE' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name =  states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {% set wait_for_entity_name = states('input_text.irrigation_cycle' ~ cycle ~ '_wait_for_entity_name') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) WARNING! Finished waiting for entity 
                    {{ '\n' }}{{ "{:>18}".format('') }}Wait Complete: {{ wait_completed }}
                    {{ '\n' }}{{ "{:>18}".format('') }}State:  {{ states(wait_for_entity_name) }}

          #=== CYCLE_ABORTED_WAITING_FOR_ENTITY
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_ABORTED_WAITING_FOR_ENTITY' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name =  states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {% set wait_for_entity_name = states('input_text.irrigation_cycle' ~ cycle ~ '_wait_for_entity_name') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) WARNING! Cycle ABBORTED - Wait for entity state timed out.
                    {{ '\n' }}{{ "{:>18}".format('') }}State:  {{ states(wait_for_entity_name) }}

          #=== CYCLE_CONTINUES_UNEXPECTED_STATE
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_CONTINUES_UNEXPECTED_STATE' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name =  states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {% set wait_for_entity_name = states('input_text.irrigation_cycle' ~ cycle ~ '_wait_for_entity_name') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) WARNING! Cycle CONTINUING with unexpected state.
                    {{ '\n' }}{{ "{:>18}".format('') }}State:  {{ states(wait_for_entity_name) }}

          #=== CYCLE STARTING
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_STARTING' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name =  states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) Starting

          #=== CYCLE ENDED
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'CYCLE_ENDED' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set cycle_name =  states('input_text.irrigation_cycle' ~ cycle ~ '_name') %}
                    {{ event_time }} - Cycle {{ cycle }} ({{ cycle_name }}) Ended
                    
                    ===========================

          #=== ZONE STARTING
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'ZONE_STARTING' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set zone_number = zone | string | replace('zone','') %}
                    {% set zone_name = states('input_text.irrigation_zone' ~ zone_number ~ '_name') %}
                    {% if seconds != 0 %}
                      {{ event_time }} - Zone {{ zone }} ({{ zone_name }}) starting for {{ seconds }} seconds
                    {% else %}
                      {{ event_time }} - Zone {{ zone }} ({{ zone_name }}) Not Watering (duration zero)
                    {% endif %}

          #=== ZONE WATERING
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'ZONE_WATERING' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set zone_number = zone | string | replace('zone','') %}
                    {% set zone_name = states('input_text.irrigation_zone' ~ zone_number ~ '_name') %}
                    {{ event_time }} - Zone {{ zone }} ({{ zone_name }}) watering

          #=== ZONE STOPING
          - conditions:
              - condition: template
                value_template: >
                  {{ log_event == 'ZONE_STOPPING' }}
            sequence:
              - action: script.irrigation_log_message
                data:
                  message: >
                    {% set zone_number = zone | string | replace('zone','') %}
                    {% set zone_name = states('input_text.irrigation_zone' ~ zone_number ~ '_name') %}
                    {{ event_time }} - Zone {{ zone }} ({{ zone_name }}) stopping

        default:
          - action: script.irrigation_log_message
            data:
              message: >
                {{ event_time }} - {{ log_event | default('Unknown Log Event') }} (Initiated_by: {{ initiated_by | default('Not Given') }})




# Bounded, restored decision journal, independent of optional file logging.
template:
  - triggers:
      - trigger: event
        event_type: irrigation_decision
    sensor:
      - name: Irrigation Last Decision
        unique_id: irrigation_last_decision
        default_entity_id: sensor.irrigation_last_decision
        icon: mdi:water-check
        state: "{{ trigger.event.data.get('reason', 'unknown') }}"
        attributes:
          records: >
            {% set old = this.attributes.get('records', []) %}
            {% set old = old if old is sequence and old is not string and old is not mapping else [] %}
            {% set d = trigger.event.data %}
            {% set cycle = d.get('cycle', '') %}
            {% set zone = d.get('zone', '') | string %}
            {% set cycle_name = states('input_text.irrigation_' ~ cycle ~ '_name') if cycle in ['cycle1','cycle2','cycle3'] else '' %}
            {% set zone_name = states('input_text.irrigation_zone' ~ zone ~ '_name') if zone | int(0) in range(1,17) else '' %}
            {{ old[-63:] + [dict(d, at=now().isoformat(),
                 cycle_name=cycle_name if cycle_name not in ['unknown','unavailable'] else '',
                 zone_name=zone_name if zone_name not in ['unknown','unavailable'] else '')] }}
