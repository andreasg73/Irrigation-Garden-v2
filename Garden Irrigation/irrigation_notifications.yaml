
#===================
#=== Input Booleans
#===================
input_boolean:

  irrigation_notify_user1:
    name: Notify User1 of events
    icon: mdi:message-text-outline

  irrigation_notify_user2:
    name: Notify User2 of events
    icon: mdi:message-text-outline


#================
#=== Automations
#================
automation:

  #========================================================================
  #=== Persistent notification when the Irrigation Controller goes Offline
  #========================================================================
  - alias: Irrigation Notify When Controller Goes Offline
    id: irrigation_notify_when_controller_goes_offline
    mode: queued
    trigger:
      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        to: 'off'

      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        from: 'off'

    condition:
      - condition: state
        entity_id: input_boolean.irrigation_ha_notify_of_controller_wifi_events
        state: 'on'

    action:
      - if:
          - condition: template
            value_template: "{{ has_value('script.irrigation_notify') }}"
        then:
          - action: script.irrigation_notify
            data:
              show: true
              notification_id: >
                notifications_{{ now() | string }}
              title: >
                📶 Irrigation Controller 📶
              message: >
                Configured irrigation controllers


                Availability is {{ states('binary_sensor.irrigation_controllers_available') | upper }}


  #=========================================
  #=== Notfy about interrupted cycle due to 
  #=== Irrigation Controller WiFi Signal 
  #=========================================
  - alias: Irrigation Notify About Cycle WiFi Interruption
    id: irrigation_notify_about_cycle_wifi_interruption
    trigger:
      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        to: 'off'

      - trigger: state
        entity_id: binary_sensor.irrigation_controllers_available
        from: 'off'

    condition:
      - condition: state
        entity_id: input_boolean.irrigation_user_notify_of_controller_wifi_events
        state: 'on'

      # - condition: state
      #   entity_id: sensor.house_mode
      #   state: Holiday
    
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.irrigation_notify_user1
            state: 'on'
          - condition: state
            entity_id: input_boolean.irrigation_notify_user2
            state: 'on'

      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.irrigation_cycle1_running
            state: 'on'
          - condition: state
            entity_id: input_boolean.irrigation_cycle2_running
            state: 'on'
          - condition: state
            entity_id: input_boolean.irrigation_cycle3_running
            state: 'on'

    variables:
      message: >
        {% if trigger.to_state.state == 'off' %}
          Irrigation Warning:
          
          Controller is OFFLINE ({{now().strftime('%H:%M:%S')}}).
          Waiting for reconnection...
        {% else %}
          Irrigation Information:
          
          Controller is back ONLINE ({{now().strftime('%H:%M:%S')}}).
        {% endif %}

    action:
      - if:
          condition: state
          entity_id: input_boolean.irrigation_notify_user1
          state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.irrigation_notify') }}"
            then:
              - action: script.irrigation_notify
                data:
                  tell: >
                    {{ states('input_text.irrigation_notification_user1_name') }}
                  type: app_notification
                  title: 🌼 Irrigation 🌼
                  message: >
                    {{ message }}

      - if:
          condition: state
          entity_id: input_boolean.irrigation_notify_user2
          state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.irrigation_notify') }}"
            then:
              - action: script.irrigation_notify
                data:
                  tell: >
                    {{ states('input_text.irrigation_notification_user2_name') }}
                  type: app_notification
                  title: 🌼 Irrigation 🌼
                  message: >
                    {{ message }}


  #========================================
  #=== Notify when a cycle starts or stops
  #========================================
  - alias: Irrigation Notify When Cycle Starts Or Stops
    id: irrigation_notify_when_cycle_starts_or_stops
    trigger:
      - trigger: state
        entity_id: input_boolean.irrigation_cycle1_running
        id: cycle1

      - trigger: state
        entity_id: input_boolean.irrigation_cycle2_running
        id: cycle2

    condition:
      - or:
          - condition: state
            entity_id: input_boolean.irrigation_notify_user1
            state: 'on'

          - condition: state
            entity_id: input_boolean.irrigation_notify_user2
            state: 'on'         

    variables:
      message: >
        {% set cycle_name = states('input_text.irrigation_' ~ trigger.id ~ '_name') %}

        {% if trigger.to_state.state == 'on' %}
          The {{ cycle_name }} cycle has started.
          The total watering time should be about {{ (states('sensor.irrigation_' ~ trigger.id ~ '_duration_in_seconds') | int(0) / 60) | int(0) }} mins

          Multipliers:
          Rain - {{ states('input_number.irrigation_rainfall_multiplier') }}
          Temp - {{ states('input_number.irrigation_temp_multiplier') }}
        {% else %}
          {{ cycle_name }} finished

          Total Watering Today 

          --------------------
          {% set zone_count = states('input_number.irrigation_number_of_zones') | int(0) %}
          {%- for zones in range(zone_count) %}
            {%- set zone_name = states('input_text.irrigation_zone' ~ loop.index ~ '_name') %}
            {%- set hours = states('sensor.irrigation_zone' ~ loop.index ~ '_total_time_today') | float(0) %}
            {%- set hrs = (hours // 1) | int(0) %}
            {%- set min = ((hours % 1) * 60) | int(0) %}
            {%- set sec = (((hours % 1) * 3600) % 60) | int(0) %}
            {%- if hours > 1 %}
              {{ '{:<13}'.format(zone_name) }} - {{ '{:1d}h {:01d}m {:01d}s'.format(hrs, min, sec) }}
            {%- else %}
              {{ '{:<13}'.format(zone_name) }} - {{ '{:01d}m {:01d}s'.format(min, sec) }}
            {%- endif %}
          {%- endfor %}
        {% endif %}

    action:
      - if:
          condition: state
          entity_id: input_boolean.irrigation_notify_user1
          state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.irrigation_notify') }}"
            then:
              - action: script.irrigation_notify
                data:
                  tell: >
                    {{ states('input_text.irrigation_notification_user1_name') | lower }}
                  type: app_notification
                  title: 🌼 Irrigation 🌼
                  message: >
                    {{ message }}

      - if:
          condition: state
          entity_id: input_boolean.irrigation_notify_user2
          state: 'on'
        then:
          - if:
              - condition: template
                value_template: "{{ has_value('script.irrigation_notify') }}"
            then:
              - action: script.irrigation_notify
                data:
                  tell: >
                    {{ states('input_text.irrigation_notification_user2_name') | lower }}
                  type: app_notification
                  title: 🌼 Irrigation 🌼
                  message: >
                    {{ message }}



# Optional external dependencies. Blank/unknown means not configured.
input_text:
  irrigation_notification_script:
    name: Notification script
    min: 0
    max: 255
  irrigation_notification_user1_name:
    name: Notification recipient 1
    min: 0
    max: 255
  irrigation_notification_user2_name:
    name: Notification recipient 2
    min: 0
    max: 255
  irrigation_log_notify_entity:
    name: File notification entity
    min: 0
    max: 255
  irrigation_announcement_script:
    name: Announcement script
    min: 0
    max: 255
  irrigation_announcement_player:
    name: Announcement media player
    min: 0
    max: 255
  irrigation_startup_ready_entity:
    name: Optional startup-ready entity
    min: 0
    max: 255
  irrigation_ha_stopping_entity:
    name: Optional shutdown entity
    min: 0
    max: 255
  irrigation_external_sensor_weather_outlook:
    name: Weather outlook entity
    min: 0
    max: 255

script:
  irrigation_notify:
    alias: Irrigation Optional Notification
    mode: queued
    max: 20
    fields:
      show:
        description: Forwarded optional show
      tell:
        description: Forwarded optional tell
      type:
        description: Forwarded optional type
      title:
        description: Forwarded optional title
      message:
        description: Forwarded optional message
      notification_id:
        description: Forwarded optional notification_id
      mobile_app_tag:
        description: Forwarded optional mobile_app_tag
    sequence:
    - variables:
        destination: '{{ states(''input_text.irrigation_notification_script'') | trim }}'
        payload: '{% set p = namespace(data={}) %}

          {% if show is defined %}{% set p.data = dict(p.data, show=show) %}{% endif %}

          {% if tell is defined %}{% set p.data = dict(p.data, tell=tell) %}{% endif %}

          {% if type is defined %}{% set p.data = dict(p.data, type=type) %}{% endif %}

          {% if title is defined %}{% set p.data = dict(p.data, title=title) %}{% endif %}

          {% if message is defined %}{% set p.data = dict(p.data, message=message) %}{% endif %}

          {% if notification_id is defined %}{% set p.data = dict(p.data, notification_id=notification_id) %}{%
          endif %}

          {% if mobile_app_tag is defined %}{% set p.data = dict(p.data, mobile_app_tag=mobile_app_tag) %}{% endif
          %}

          {{ p.data }}'
    - condition: template
      value_template: '{{ destination.startswith(''script.'') and destination != this.entity_id and has_value(destination)
        }}'
    - action: script.turn_on
      target:
        entity_id: '{{ destination }}'
      data:
        variables: '{{ payload }}'
      continue_on_error: true
  irrigation_announce:
    alias: Irrigation Optional Announcement
    mode: queued
    max: 20
    fields:
      announcement:
        description: Forwarded optional announcement
      initiated_by:
        description: Forwarded optional initiated_by
      media_players:
        description: Forwarded optional media_players
    sequence:
    - variables:
        destination: '{{ states(''input_text.irrigation_announcement_script'') | trim }}'
        payload: '{% set p = namespace(data={}) %}

          {% if announcement is defined %}{% set p.data = dict(p.data, announcement=announcement) %}{% endif %}

          {% if initiated_by is defined %}{% set p.data = dict(p.data, initiated_by=initiated_by) %}{% endif %}

          {% if media_players is defined %}{% set p.data = dict(p.data, media_players=media_players) %}{% endif
          %}

          {{ p.data }}'
    - condition: template
      value_template: '{{ destination.startswith(''script.'') and destination != this.entity_id and has_value(destination)
        and media_players is defined and media_players | count > 0 and (media_players | map(attribute=''entity_id'')
        | select(''has_value'') | list | count == media_players | count) }}'
    - action: script.turn_on
      target:
        entity_id: '{{ destination }}'
      data:
        variables: '{{ payload }}'
      continue_on_error: true
  irrigation_log_message:
    alias: Irrigation Optional Log Message
    mode: queued
    max: 50
    fields:
      message:
        required: true
    sequence:
    - variables:
        destination: '{{ states(''input_text.irrigation_log_notify_entity'') | trim }}'
    - condition: template
      value_template: '{{ destination.startswith(''notify.'') and has_value(destination) }}'
    - action: notify.send_message
      target:
        entity_id: '{{ destination }}'
      data:
        message: '{{ message }}'
      continue_on_error: true

template:
- sensor:
  - name: Irrigation Weather Outlook
    unique_id: irrigation_weather_outlook
    icon: mdi:weather-cloudy
    state: '{% set source = states(''input_text.irrigation_external_sensor_weather_outlook'') | trim %}{{ states(source)
      if has_value(source) else ''Not configured'' }}'

