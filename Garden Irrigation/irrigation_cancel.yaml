# Kloggy Version2: cancellation, modernized for HA 2026.10.
script:
  irrigation_cancel_irrigation:
    alias: Irrigation Cancel Irrigation
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.irrigation_stop_in_progress
      - variables:
          restart_entrypoints: >
            {{ ['automation.irrigation_triggered', 'automation.irrigation_triggered_cycle_start']
               | select('is_state', 'on') | list }}
          cycle_snapshot: "{{ states('input_text.irrigation_active_cycle') }}"
          zone_snapshot: "{{ states('input_text.irrigation_active_zone') }}"
      # Abort both a waiting schedule and a pending start before the worker.
      - action: automation.turn_off
        target:
          entity_id:
            - automation.irrigation_triggered
            - automation.irrigation_triggered_cycle_start
        data:
          stop_actions: true
      - action: script.turn_off
        target:
          entity_id:
            - script.irrigation_run_a_cycle
            - script.irrigation_run_a_single_zone_on_demand
      - variables:
          cycle: >
            {{ cycle_snapshot if cycle_snapshot in ['cycle1','cycle2','cycle3']
               else cycle | default('') | string }}
          zone: >
            {{ zone_snapshot if zone_snapshot is match('^zone([1-9]|1[0-6])$')
               else zone | default('') | string }}
          mapped_zone_switches: >
            {% set ns = namespace(ids=[]) %}
            {% set existing = states.switch | map(attribute='entity_id') | list %}
            {% for n in range(1,17) %}
              {% set entity = states('input_text.irrigation_zone' ~ n ~ '_switch_entity_id') | trim %}
              {% if entity in existing %}{% set ns.ids = ns.ids + [entity] %}{% endif %}
            {% endfor %}
            {% set active = states('input_text.irrigation_active_switch') %}
            {% if active in existing %}{% set ns.ids = ns.ids + [active] %}{% endif %}
            {{ ns.ids | unique | list }}
      # Disabled switches is a complete no-output mode, including OFF.
      - if:
          - condition: state
            entity_id: input_boolean.irrigation_disable_switches
            state: 'off'
          - condition: state
            entity_id: input_boolean.irrigation_output_mode_initialized
            state: 'on'
          - condition: template
            value_template: "{{ mapped_zone_switches | length > 0 }}"
        then:
          - repeat:
              for_each: "{{ mapped_zone_switches }}"
              sequence:
                # An earlier OFF may still be awaiting its integration. Recheck
                # mode for each next output instead of relying on the outer IF.
                - if:
                    - condition: state
                      entity_id: input_boolean.irrigation_disable_switches
                      state: 'off'
                    - condition: state
                      entity_id: input_boolean.irrigation_output_mode_initialized
                      state: 'on'
                  then:
                    - action: switch.turn_off
                      continue_on_error: true
                      target:
                        entity_id: "{{ repeat.item }}"
      # Capture elapsed time only from a valid, running timer.
      - if:
          - condition: template
            value_template: >
              {{ cycle in ['cycle1','cycle2','cycle3']
                 and zone is match('^zone([1-9]|1[0-6])$')
                 and is_state('timer.irrigation_' ~ zone ~ '_timer','active') }}
        then:
          - action: timer.pause
            target:
              entity_id: "{{ 'timer.irrigation_' ~ zone ~ '_timer' }}"
          - variables:
              elapsed: >
                {% set timer = 'timer.irrigation_' ~ zone ~ '_timer' %}
                {% set total = as_timedelta(state_attr(timer,'duration') or '00:00:00').total_seconds() %}
                {% set remaining = as_timedelta(state_attr(timer,'remaining') or '00:00:00').total_seconds() %}
                {{ [total - remaining, 0] | max | round(0) | int }}
          - action: input_text.set_value
            target:
              entity_id: "{{ 'input_text.irrigation_' ~ zone ~ '_previous_duration_in_seconds' }}"
            data:
              value: "{{ elapsed }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.irrigation_previous_total_watering_time
            data:
              value: "{{ (states('input_text.irrigation_previous_total_watering_time') | float(0) + elapsed) | round(0) | int }}"
      # Always cancel all package timers, even if the caller has no zone.
      - action: timer.cancel
        target:
          entity_id: >
            {% set ns = namespace(ids=[]) %}
            {% for n in range(1,17) %}{% set ns.ids = ns.ids + ['timer.irrigation_zone' ~ n ~ '_timer'] %}{% endfor %}
            {{ ns.ids }}
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.irrigation_cycle1_running
            - input_boolean.irrigation_cycle2_running
            - input_boolean.irrigation_cycle3_running
      - if:
          - condition: template
            value_template: >
              {{ not states('input_text.irrigation_active_switch').startswith('switch.')
                 or is_state(states('input_text.irrigation_active_switch'),'off') }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.irrigation_active_switch
            data:
              value: ''
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.irrigation_active_cycle
            - input_text.irrigation_active_zone
        data:
          value: ''
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_current_status
        data:
          value: >
            {{ 'STOP: output not confirmed OFF' if states('input_text.irrigation_active_switch').startswith('switch.') else 'SYSTEM IDLE' }}
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_previous_run_cycle_name
        data:
          value: "{{ (states('input_text.irrigation_previous_run_cycle_name').replace(' (Cancelled)','')[:18] ~ ' (Cancelled)')[:30] }}"
      - if:
          - condition: state
            entity_id: input_boolean.irrigation_master_control_switch
            state: 'on'
          - condition: template
            value_template: "{{ restart_entrypoints | length > 0 }}"
        then:
          - action: automation.turn_on
            target:
              entity_id: "{{ restart_entrypoints }}"
      - action: script.irrigation_restore_single_zone_settings
        continue_on_error: true

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigation_stop_in_progress
