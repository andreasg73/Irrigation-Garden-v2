#===================
#=== Input Booleans
#===================
input_boolean:

  irrigation_ha_notify_of_controller_wifi_events:
    name: HA Notify of Controller WiFi Events
    icon: mdi:wifi-alert

  irrigation_user_notify_of_controller_wifi_events:
    name: User Notify of Controller WiFi Events
    icon: mdi:wifi-alert


#================
#=== Input Texts
#================
input_text:

  irrigation_external_sensor_controller_1_wifi:
    name: Irrigation Controller 1 WiFi Signal Strength
    icon: mdi:wifi
    min: 0
    max: 100

  irrigation_external_sensor_controller_2_wifi:
    name: Irrigation Controller 2 WiFi Signal Strength
    icon: mdi:wifi
    min: 0
    max: 100


#==================
#=== Input Numbers
#==================
input_number:

  irrigation_controller_offline_wait: 
    name: Time to wait for Controller when offline
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: secs
    icon: mdi:timer-sand


#================
#=== Automations
#================
automation:

  #================================================
  #=== Set default Controller 1 WiFi Signal Sensor
  #================================================
  - alias: Irrigation Set Default Controller 1 WiFi Signal Sensor
    id: irrigation_set_default_controller_wifi_1_signal_sensor
    trigger:
      #=== If HA starts
      - trigger: homeassistant
        event: start

      - trigger: state
        entity_id: input_text.irrigation_external_sensor_controller_1_wifi
        to: ''

    condition:
      condition: or
      conditions:
        - condition: state
          entity_id: input_text.irrigation_external_sensor_controller_1_wifi
          state: 'unknown'

        - condition: state
          entity_id: input_text.irrigation_external_sensor_controller_1_wifi
          state: ''

    action:
      - action: input_text.set_value
        data:
          entity_id: input_text.irrigation_external_sensor_controller_1_wifi
          value: Not set
          # value: sensor.esphome_irrigation_controller_wifi_signal


  #================================================
  #=== Set default Controller 2 WiFi Signal Sensor
  #================================================
  - alias: Irrigation Set Default Controller 2 WiFi Signal Sensor
    id: irrigation_set_default_controller_2_wifi_signal_sensor
    trigger:
      #=== If HA starts
      - trigger: homeassistant
        event: start

      - trigger: state
        entity_id: input_text.irrigation_external_sensor_controller_2_wifi
        to: ''

    condition:
      condition: or
      conditions:
        - condition: state
          entity_id: input_text.irrigation_external_sensor_controller_2_wifi
          state: 'unknown'

        - condition: state
          entity_id: input_text.irrigation_external_sensor_controller_2_wifi
          state: ''

    action:
      - action: input_text.set_value
        data:
          entity_id: input_text.irrigation_external_sensor_controller_2_wifi
          value: Not set
          # value: sensor.esphome_irrigation_controller_2_wifi_signal




# Both original Wi-Fi configuration fields feed diagnostics. They do not imply
# a zone/controller mapping: actual availability is checked on the mapped switch.
template:
  - binary_sensor:
      - name: Irrigation Controllers Available
        unique_id: irrigation_controllers_available
        state: >
          {% set ns = namespace(ok=true) %}
          {% for n in [1,2] %}
            {% set entity = states('input_text.irrigation_external_sensor_controller_' ~ n ~ '_wifi') | trim %}
            {% if entity is match('^[a-z_]+\.[a-z0-9_]+$') and not has_value(entity) %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
