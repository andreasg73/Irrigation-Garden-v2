
#============
#=== Scripts
#============
script:

  #========================================
  #=== Run a Single Zone On Demand
  #===
  #=== Passed
  #===  zone  - [zone1, zone2, ... zone16]
  #========================================
  irrigation_run_a_single_zone_on_demand:
    alias: Irrigation Run A Single Zone On Demand
    description: Irrigate A Single Zone On Demand
    fields: 
      zone:
        description: Zone to irrigate
        example: zone1

    mode: single
    sequence:
      #=== Only continue if Master Control Switch is on
      - condition: state
        entity_id: input_boolean.irrigation_master_control_switch
        state: 'on'

      #=== Only continue if no Cycles are running
      - condition: state
        entity_id: input_boolean.irrigation_cycle1_running
        state: 'off'

      - condition: state
        entity_id: input_boolean.irrigation_cycle2_running
        state: 'off'

      - condition: state
        entity_id: input_boolean.irrigation_cycle3_running
        state: 'off'

      #=== Validate selected zone before changing Cycle 3 durations.
      - condition: template
        value_template: >
          {% set selected = zone | default('') %}
          {% set zone_number = selected[4:] | int(0) if selected.startswith('zone') else 0 %}
          {{ selected == 'zone' ~ zone_number and
             zone_number >= 1 and
             zone_number <= [states('input_number.irrigation_number_of_zones') | int(0), 16] | min }}

      - condition: state
        entity_id: input_boolean.irrigation_stop_in_progress
        state: 'off'
      - condition: template
        value_template: "{{ states('input_text.irrigation_single_zone_backup') in ['', 'unknown'] }}"

      # Persist the exact 16 durations and schedule flags before altering them.
      # Unlike a dynamic scene, this survives an HA restart.
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_single_zone_backup
        data:
          value: >
            {% set ns = namespace(d=[]) %}
            {% for n in range(1,17) %}
              {% set ns.d = ns.d + [states('input_number.irrigation_cycle3_zone' ~ n ~ '_duration') | float(0)] %}
            {% endfor %}
            {{ {'d': ns.d, 's': [is_state('input_boolean.irrigation_cycle1_schedule_enabled','on'),
                                  is_state('input_boolean.irrigation_cycle2_schedule_enabled','on')]} | to_json }}

      #=== Disable schedules for Cycles 1 and 2
      - action: input_boolean.turn_off
        entity_id:
          - input_boolean.irrigation_cycle1_schedule_enabled
          - input_boolean.irrigation_cycle2_schedule_enabled

      - repeat:
          count: 16
          sequence:
            - if:
                - condition: template
                  value_template: "{{ zone != 'zone' ~ repeat.index }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ 'input_number.irrigation_cycle3_zone' ~ repeat.index ~ '_duration' }}"
                  data:
                    value: 0


      #=== Write To Log
      - action: script.irrigation_write_to_log
        continue_on_error: true
        data:
          log_event: SINGLE_ZONE_STARTING
          zone: >
            {{ zone }}
          event_time: >
            {{ now() }}

      # Recheck after preparing settings: STOP may have arrived meanwhile.
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.irrigation_master_control_switch','on') or not is_state('input_boolean.irrigation_stop_in_progress','off') }}"
        then:
          - action: script.irrigation_restore_single_zone_settings
          - stop: Start cancelled

      #=== Start Cycle 3
      - action: input_boolean.turn_on
        entity_id: input_boolean.irrigation_cycle3_running

      #=== Wait for Cycle 3 to start
      - wait_template: >
          {{ is_state('input_boolean.irrigation_cycle3_running', 'on') }}
      
      #=== Wait for Cycle 3 to end
      - wait_template: >
          {{ is_state('input_boolean.irrigation_cycle3_running', 'off') }}

      #=== Restore previous settings
      - action: script.irrigation_restore_single_zone_settings

  irrigation_restore_single_zone_settings:
    alias: Irrigation Restore Single Zone Settings
    mode: single
    sequence:
      - variables:
          saved: "{{ states('input_text.irrigation_single_zone_backup') | from_json({}) }}"
      - condition: template
        value_template: "{{ saved is mapping and saved.get('d',[]) | length == 16 and saved.get('s',[]) | length == 2 }}"
      - repeat:
          count: 16
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "{{ 'input_number.irrigation_cycle3_zone' ~ repeat.index ~ '_duration' }}"
              data:
                value: "{{ saved['d'][repeat.index - 1] }}"
      # Master OFF / restart always leaves schedules disabled.
      - if:
          - condition: state
            entity_id: input_boolean.irrigation_master_control_switch
            state: 'on'
        then:
          - repeat:
              count: 2
              sequence:
                - action: "{{ 'input_boolean.turn_on' if saved['s'][repeat.index - 1] else 'input_boolean.turn_off' }}"
                  target:
                    entity_id: "{{ 'input_boolean.irrigation_cycle' ~ repeat.index ~ '_schedule_enabled' }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_single_zone_backup
        data:
          value: ''
