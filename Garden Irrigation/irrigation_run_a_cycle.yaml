
#============
#=== Scripts
#============
script:

  #================================================
  #=== Run A Cycle
  #===
  #=== Passed
  #===  cycle - [cycle1, cycle2, cycle3]
  #================================================
  irrigation_run_a_cycle:
    alias: Irrigation Run A Cycle
    description: Run An Irrigation Cycle
    fields: 
      cycle:
        description: Cycle to run
        example: cycle1

    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.irrigation_output_mode_initialized
        state: 'on'
      - condition: state
        entity_id: input_boolean.irrigation_master_control_switch
        state: 'on'
      - condition: template
        value_template: "{{ cycle | default('') in ['cycle1', 'cycle2', 'cycle3'] }}"
      - condition: state
        entity_id: input_boolean.irrigation_stop_in_progress
        state: 'off'
      - condition: template
        value_template: >
          {{ is_state('input_boolean.irrigation_' ~ cycle ~ '_running','on')
             and (not states('input_text.irrigation_active_switch').startswith('switch.')
                  or is_state(states('input_text.irrigation_active_switch'),'off')) }}
      - variables:
          physical_run: "{{ is_state('input_boolean.irrigation_disable_switches','off') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_active_cycle
        data:
          value: "{{ cycle }}"

      - event: irrigation_decision

        continue_on_error: true
        event_data:
          reason: "cycle_started"
          cycle: "{{ cycle }}"
          physical: "{{ physical_run }}"

      #=== Short pause before starting
      - delay:
          seconds: 1

      #=== Run each configured zone, never beyond the original 16.
      #=== Missing/invalid zone count means no watering.
      - repeat:
          count: >
            {{ [[states('input_number.irrigation_number_of_zones') | int(0), 0] | max, 16] | min }}
          sequence:
            - condition: template
              value_template: >
                {{ is_state('input_boolean.irrigation_master_control_switch','on')
                   and is_state('input_boolean.irrigation_stop_in_progress','off')
                   and is_state('input_boolean.irrigation_' ~ cycle ~ '_running','on') }}
            #=== Resolve zone entity once per zone, so changing mapping mid-run cannot redirect a relay.
            - variables:
                irrigation_zone_entity: "{{ states('input_text.irrigation_zone' ~ repeat.index ~ '_switch_entity_id') | trim }}"
                zone_seconds: "{{ [[states('sensor.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_actual_duration_in_seconds') | int(0), 0] | max, 7200] | min }}"
            - variables:
                irrigation_zone_entity_valid: >
                  {{ irrigation_zone_entity.startswith('switch.')
                     and irrigation_zone_entity in (states.switch | map(attribute='entity_id') | list) }}

            # Snapshot the chosen runtime and its inputs before any yielding service.
            - variables:
                decision_base: "{{ states('input_number.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_duration') }}"
                decision_duration: "{{ states('sensor.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_actual_duration_in_seconds') }}"
                decision_rain: "{{ cycle != 'cycle3' and is_state('input_boolean.irrigation_' ~ cycle ~ '_adjust_for_rainfall','on') }}"
                decision_temp: "{{ cycle != 'cycle3' and is_state('input_boolean.irrigation_' ~ cycle ~ '_adjust_for_temperature','on') }}"
                decision_rain_factor: "{{ states('input_number.irrigation_rainfall_multiplier') }}"
                decision_temp_factor: "{{ states('input_number.irrigation_temp_multiplier') }}"
                decision_min: "{{ states('input_number.irrigation_weather_adjusted_minimum_duration_in_seconds') | float(0) }}"
                decision_max: "{{ states('input_number.irrigation_weather_adjusted_maximum_duration_in_minutes') | float(0) * 60 }}"
                decision_testing: "{{ is_state('input_boolean.irrigation_testing_mode','on') }}"
                decision_today: >
                  {% set today = ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] %}
                  {{ cycle == 'cycle3' or
                     is_state('input_boolean.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_every_day','on') or
                     is_state('input_boolean.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_' ~ today,'on') }}
            - variables:
                decision_expected: >
                  {% set d = decision_base | float(0) * 60 %}
                  {% if decision_rain %}{% set d = d * (decision_rain_factor | float(0)) %}{% endif %}
                  {% if decision_temp %}{% set d = d * (decision_temp_factor | float(0)) %}{% endif %}
                  {% if d != 0 and (decision_rain or decision_temp) %}
                    {% if d > decision_max %}{% set d = decision_max %}
                    {% elif d < decision_min %}{% set d = decision_min %}{% endif %}
                  {% endif %}
                  {% if not decision_today or (cycle != 'cycle3' and decision_base | int(0) == 0) %}{% set d = 0 %}{% endif %}
                  {% set d = ((d / 60) if decision_testing else d) | round() | int(0) %}
                  {{ [[d, 0] | max, 7200] | min }}
                decision_reason: >
                  {% if not is_number(decision_duration) %}duration_unknown
                  {% elif not is_number(decision_base) %}duration_unknown
                  {% elif decision_base | float(0) == 0 %}duration_zero
                  {% elif not decision_today %}zone_not_today
                  {% elif zone_seconds == 0 and decision_rain and decision_rain_factor | float(0) == 0 %}rain_adjusted_zero
                  {% elif zone_seconds == 0 and decision_temp and decision_temp_factor | float(0) == 0 %}temp_adjusted_zero
                  {% elif zone_seconds == 0 %}duration_rounded_zero
                  {% elif physical_run and not irrigation_zone_entity_valid %}output_unassigned
                  {% else %}duration_selected{% endif %}
            - event: irrigation_decision
              continue_on_error: true
              event_data:
                reason: "{{ (decision_reason | trim) if decision_expected == zone_seconds else 'duration_snapshot_changed' }}"
                cycle: "{{ cycle }}"
                zone: "{{ repeat.index }}"
                seconds: "{{ zone_seconds }}"
                base: "{{ decision_base }}"
                rain: "{{ decision_rain }}"
                rain_factor: "{{ decision_rain_factor }}"
                temperature: "{{ decision_temp }}"
                temperature_factor: "{{ decision_temp_factor }}"
                minimum: "{{ decision_min }}"
                maximum: "{{ decision_max }}"
                testing: "{{ decision_testing }}"
                physical: "{{ physical_run }}"
                expected: "{{ decision_expected }}"
                output: "{{ irrigation_zone_entity }}"

            #=== Write To Log
            - action: script.irrigation_write_to_log
              continue_on_error: true
              data:
                log_event: ZONE_STARTING
                zone: >
                  {{ repeat.index }}
                seconds: >
                  {{ zone_seconds }}
                event_time: >
                  {{ now() }}

            - choose:
                #=== If duration for this zone is not zero
                - conditions:
                    condition: template
                    value_template: >
                      {{ zone_seconds > 0 and (not physical_run or irrigation_zone_entity_valid) }}

                  sequence:
                    #=== Set FAILSAFE time to 10 seconds longer than the zone runtime
                    - action: input_number.set_value
                      data:
                        entity_id: input_number.irrigation_failsafe_time_in_seconds
                        value: >
                          {{ zone_seconds + 10 }}

                    #=== Write To Log
                    - action: script.irrigation_write_to_log
                      continue_on_error: true
                      data:
                        log_event: FAILSAFE_SET
                        zone: >
                          {{ repeat.index }}
                        event_time: >
                          {{ now() }}

                    #=== Update Status with Zone being watered
                    - action: input_text.set_value
                      data:
                        entity_id: input_text.irrigation_current_status
                        value: Watering...

                    #=== Update last run details for this zone
                    - action: input_text.set_value
                      data:
                        entity_id: >
                          input_text.irrigation_zone{{ repeat.index }}_previous_duration_in_seconds
                        value: >
                            Watering

                    # Availability follows this zone's mapped output. The two Wi-Fi
                    # sensors are diagnostics; the original has no controller/zone map.
                    - if:
                        - condition: template
                          value_template: "{{ physical_run }}"
                      then:
                        - wait_template: "{{ states(irrigation_zone_entity) in ['on','off'] }}"
                          timeout:
                            seconds: "{{ [[states('input_number.irrigation_controller_offline_wait') | int(1), 1] | max, 60] | min }}"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ not wait.completed }}"
                          then:
                            - event: irrigation_decision
                              continue_on_error: true
                              event_data:
                                reason: "output_unavailable"
                                cycle: "{{ cycle }}"
                                zone: "{{ repeat.index }}"
                                output: "{{ irrigation_zone_entity }}"
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.irrigation_master_control_switch
                            - stop: Mapped output unavailable
                              error: true

                    - action: input_text.set_value
                      target:
                        entity_id: input_text.irrigation_active_zone
                      data:
                        value: "{{ 'zone' ~ repeat.index }}"
                    #=== Start the timer
                    - action: timer.start
                      data:
                        entity_id: >
                          timer.irrigation_zone{{ repeat.index }}_timer
                        duration: >
                          {{ zone_seconds }}

                    #=== Write To Log
                    - action: script.irrigation_write_to_log
                      continue_on_error: true
                      data:
                        log_event: ZONE_WATERING
                        zone: >
                          {{ repeat.index }}
                        event_time: >
                          {{ now() }}

                    #=== Wait for the timer to start (Probably unnecessary but...)
                    - wait_template: >
                        {% set entity_id = 'timer.irrigation_zone' ~ repeat.index ~ '_timer' %}
                        {{ is_state(entity_id, 'active') }}
                      timeout: "00:00:10"
                      continue_on_timeout: false

                    #=== If switches are not disabled (used when testing)
                    - choose:
                      - conditions:
                          condition: state
                          entity_id: input_boolean.irrigation_disable_switches
                          state:  'off'
                          # Additional guard: skip unknown/unconfigured/non-switch entity IDs.
                        sequence:
                          - condition: template
                            value_template: "{{ irrigation_zone_entity_valid }}"
                          - condition: template
                            value_template: >
                              {{ physical_run
                                 and is_state('input_boolean.irrigation_master_control_switch','on')
                                 and is_state('input_boolean.irrigation_stop_in_progress','off')
                                 and is_state('input_boolean.irrigation_' ~ cycle ~ '_running','on') }}
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: input_datetime.irrigation_failsafe_deadline
                            data:
                              timestamp: "{{ as_timestamp(now()) + zone_seconds + 10 }}"
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.irrigation_active_switch
                            data:
                              value: "{{ irrigation_zone_entity }}"
                          # Helper service calls above yield to other tasks.
                          # Recheck immediately before dispatching a physical ON.
                          - if:
                              - condition: template
                                value_template: >
                                  {{ not (physical_run
                                     and is_state('input_boolean.irrigation_disable_switches','off')
                                     and is_state('input_boolean.irrigation_output_mode_initialized','on')
                                     and is_state('input_boolean.irrigation_master_control_switch','on')
                                     and is_state('input_boolean.irrigation_stop_in_progress','off')
                                     and is_state('input_boolean.irrigation_' ~ cycle ~ '_running','on')
                                     and states(irrigation_zone_entity) in ['on','off']) }}
                            then:
                              - event: irrigation_decision
                                continue_on_error: true
                                event_data:
                                  reason: "output_permission_changed"
                                  cycle: "{{ cycle }}"
                                  zone: "{{ repeat.index }}"
                                  output: "{{ irrigation_zone_entity }}"
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: input_boolean.irrigation_master_control_switch
                              - stop: Output permission changed before opening zone
                          #=== Start watering
                          - action: switch.turn_on
                            continue_on_error: true
                            target:
                              entity_id: "{{ irrigation_zone_entity }}"
                          - wait_template: "{{ is_state(irrigation_zone_entity,'on') }}"
                            timeout: '00:00:05'
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: "{{ not wait.completed }}"
                            then:
                              - event: irrigation_decision
                                continue_on_error: true
                                event_data:
                                  reason: "output_not_on"
                                  cycle: "{{ cycle }}"
                                  zone: "{{ repeat.index }}"
                                  output: "{{ irrigation_zone_entity }}"
                              - action: input_boolean.turn_off
                                target:
                                  entity_id: input_boolean.irrigation_master_control_switch
                              - stop: Output did not confirm ON
                                error: true

                    #=== Wait for the timer to end
                    #===
                    #=== As of v2022.04 timers resume after a restart so this would be better than a wait_template
                    # - wait_for trigger:
                    #     - platform: event
                    #       event_type: timer.finished
                    #       event_data:
                    #         entity_id: >
                    #           {{ 'timer.irrigation_zone' ~ repeat.index ~ '_timer' }}

                    - wait_template: >
                        {% set entity_id = 'timer.irrigation_zone' ~ repeat.index ~ '_timer' %}
                        {{ is_state(entity_id, 'idle') }}
                      timeout:
                        seconds: >
                          {{ zone_seconds + 10 }}
                      continue_on_timeout: true

                    #=== Stop Watering; disabled switches means no output calls, including OFF.
                    - if:
                        - condition: template
                          value_template: "{{ physical_run and is_state('input_boolean.irrigation_disable_switches', 'off') and is_state('input_boolean.irrigation_output_mode_initialized', 'on') and irrigation_zone_entity_valid }}"
                      then:
                        - action: switch.turn_off
                          continue_on_error: true
                          target:
                            entity_id: "{{ irrigation_zone_entity }}"

                    # Never proceed to another zone until closure is confirmed.
                    - if:
                        - condition: template
                          value_template: "{{ physical_run }}"
                      then:
                        - wait_template: "{{ is_state(irrigation_zone_entity,'off') }}"
                          timeout: '00:00:05'
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ not wait.completed }}"
                          then:
                            - event: irrigation_decision
                              continue_on_error: true
                              event_data:
                                reason: "output_not_off"
                                cycle: "{{ cycle }}"
                                zone: "{{ repeat.index }}"
                                output: "{{ irrigation_zone_entity }}"
                            - action: input_boolean.turn_off
                              target:
                                entity_id: input_boolean.irrigation_master_control_switch
                            - stop: Output did not confirm OFF; watchdog retains snapshot
                              error: true
                    - action: input_text.set_value
                      target:
                        entity_id:
                          - input_text.irrigation_active_switch
                          - input_text.irrigation_active_zone
                      data:
                        value: ''

                    #=== Write To Log
                    - action: script.irrigation_write_to_log
                      continue_on_error: true
                      data:
                        log_event: ZONE_STOPPING
                        zone: >
                          {{ repeat.index }}
                        event_time: >
                          {{ now() }}

                    #=== Update last run time for this zone
                    - action: input_text.set_value
                      data:
                        entity_id: >
                          input_text.irrigation_zone{{ repeat.index }}_previous_duration_in_seconds
                        value: >
                          {% set duration = zone_seconds %}
                          {% set today = now().strftime('%a') | lower %}

                          {% if cycle == 'cycle3' or
                                is_state('input_boolean.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_every_day', 'on') or
                                is_state('input_boolean.irrigation_' ~ cycle ~ '_zone' ~ repeat.index ~ '_' ~ today, 'on' ) %}
                            {{ duration }}
                          {% else %}
                            Not scheduled today ({{ today.title() }})
                          {% endif %}

                    #=== Update last run total watering time
                    - action: input_text.set_value
                      data:
                        entity_id: input_text.irrigation_previous_total_watering_time
                        value: >
                          {% set duration = zone_seconds %}
                          {% set current_total = states('input_text.irrigation_previous_total_watering_time') | float(0) %}

                          {{ (current_total + duration) | string }}

                    #=== Update Status
                    - action: input_text.set_value
                      data:
                        entity_id: input_text.irrigation_current_status
                        value: Changing Zone...

                    #=== Pause between zones (to allow HA state machine to stabalise and the physical valves to reset)
                    - delay:
                        seconds: >
                            {{ states('input_number.irrigation_pause_between_zones_in_seconds') | int(0) }}

      - action: input_text.set_value
        target:
          entity_id:
            - input_text.irrigation_active_cycle
            - input_text.irrigation_active_zone
        data:
          value: ''
      #=== CYCLE END PROCESSING
      - action: input_boolean.turn_off
        data:
          entity_id: >
            input_boolean.irrigation_{{ cycle }}_running

      #=== If 'Today Only' is on turn off schedule and reset 'Today Only'
      - choose:
          - conditions:
              condition: template
              value_template: >
                {{ is_state('input_boolean.irrigation_' + cycle + '_schedule_today_only', 'on') }}
            sequence:
              - action: homeassistant.turn_off
                data:
                  entity_id:
                    - input_boolean.irrigation_{{ cycle }}_schedule_today_only
                    - input_boolean.irrigation_{{ cycle }}_schedule_enabled

      #=== Update Status to Idle
      - action: input_text.set_value
        data:
          entity_id: input_text.irrigation_current_status
          value: SYSTEM IDLE

      #=== Write To Log
      - action: script.irrigation_write_to_log
        continue_on_error: true
        data:
          log_event: CYCLE_ENDED
          cycle: >
            {{ cycle[-1] }}
          event_time: >
            {{ now() }}
      - event: irrigation_decision
        continue_on_error: true
        event_data:
          reason: "cycle_finished"
          cycle: "{{ cycle }}"
          physical: "{{ physical_run }}"
