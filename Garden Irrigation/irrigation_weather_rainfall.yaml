  #===================================================
  #=== Initialise the Rainfall Sensors when HA starts
  #===================================================
  - alias: Irrigation Initialise Rainfall Sensors
    id: irrigation_initialise_rainfall_sensors
    trigger:
      #=== If HA starts
      - trigger: homeassistant
        event: start

    action:
      - action: homeassistant.update_entity
        data:
          entity_id: 
            - sensor.irrigation_sensor_rainfall_today
            - sensor.irrigation_sensor_rainfall_yesterday
            - sensor.irrigation_sensor_forecast_rain
            - binary_sensor.irrigation_sensor_raining_now


  #===============================================================
  #=== Cycle rainfall history figures for the four previous days.
  #===============================================================
  - alias: Irrigation Rainfall Nightly Update
    id: irrigation_rainfall_nightly_update
    initial_state: true
    mode: queued
    trigger:
    - trigger: time
      at: 00:00:01
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      minutes: /5
    - trigger: state
      entity_id:
      - sensor.irrigation_sensor_rainfall_today
      - sensor.irrigation_sensor_rainfall_yesterday
    action:
    - action: script.irrigation_rainfall_update_calendar


  #==============================================================================
  #=== Calculate rain multiplier
  #===
  #=== This multiplier (maximum 1.00) will decrease watering time proportionally
  #=== based on the difference between the rainfall threshold and the amount of
  #=== rain over the last few days. If the threshold is reached then it will
  #=== stop watering completely.
  #==============================================================================
  - alias: Irrigation Rainfall Calculate Multiplier
    id: irrigation_rainfall_calculate_multiplier
    mode: queued
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.irrigation_rainfall_use_rolling_values
          - input_number.irrigation_days_of_rainfall_history_used
          - input_number.irrigation_rainfall_threshold
          - input_number.irrigation_rainfall_percentage_1
          - input_number.irrigation_rainfall_percentage_2
          - input_number.irrigation_rainfall_percentage_3
          - input_number.irrigation_rainfall_percentage_4
          - sensor.irrigation_sensor_rainfall_today
          - sensor.irrigation_sensor_rainfall_yesterday
          - input_number.irrigation_rainfall_2
          - input_number.irrigation_rainfall_3
          - input_number.irrigation_rainfall_4
          - sensor.irrigation_sensor_rainfall_last_twenty_four_hours
          - sensor.irrigation_sensor_rainfall_between_24_and_48_hours_ago
          - sensor.irrigation_sensor_rainfall_between_48_and_72_hours_ago
          - sensor.irrigation_sensor_rainfall_between_72_and_96_hours_ago
          - sensor.irrigation_sensor_rainfall_between_96_and_120_hours_ago

    condition:
    - condition: template
      value_template: >-
        {% set records = states('input_text.irrigation_rainfall_daily_records') | from_json([]) %}

        {% set ns = namespace(valid={}) %}

        {% for day in range(5) %}
          {% set entity = 'sensor.irrigation_sensor_rainfall_' ~ ('today' if day == 0 else 'yesterday') if day < 2 else
        'input_number.irrigation_rainfall_' ~ day %}
          {% if day < 2 %}
            {% set name = states('input_text.irrigation_external_sensor_rainfall_' ~ ('today' if day == 0 else 'yesterday'))
        %}
            {% set source = states[name] if name is match('^[a-z_]+\.[a-z0-9_]+$') else none %}
            {% set ok = is_number(states(entity)) and 0 <= states(entity) | float(-1) <= 10000 and source is not none
        and as_local(source.last_reported).date() == now().date() %}
          {% else %}
            {% set date = (now() - timedelta(days=day)).date().isoformat() %}
            {% set matches = records | selectattr('0','eq',date) | list if records is sequence and records is not string
        and records is not mapping else [] %}
            {% set row = matches[0] if matches | length > 0 else [] %}
            {% set value = row[1] if row | length == 2 else none %}
            {% set ok = is_number(value) and is_number(states(entity)) and states(entity) | float(-1) == value | float(-2)
        %}
          {% endif %}
          {% set ns.valid = dict(ns.valid, **{entity: ok}) %}
        {% endfor %}

        {% for name in ['last_twenty_four_hours','between_24_and_48_hours_ago','between_48_and_72_hours_ago','between_72_and_96_hours_ago','between_96_and_120_hours_ago']
        %}
          {% set entity = 'sensor.irrigation_sensor_rainfall_' ~ name %}
          {% set ns.valid = dict(ns.valid, **{entity: is_number(states(entity)) and states(entity) | float(-1) >= 0})
        %}
        {% endfor %}

        {% set mode = states('input_boolean.irrigation_rainfall_use_rolling_values') %}

        {% set days = states('input_number.irrigation_days_of_rainfall_history_used') %}

        {% set threshold = states('input_number.irrigation_rainfall_threshold') %}

        {% set sources = ['sensor.irrigation_sensor_rainfall_last_twenty_four_hours','sensor.irrigation_sensor_rainfall_between_24_and_48_hours_ago','sensor.irrigation_sensor_rainfall_between_48_and_72_hours_ago','sensor.irrigation_sensor_rainfall_between_72_and_96_hours_ago','sensor.irrigation_sensor_rainfall_between_96_and_120_hours_ago']
        if mode == 'on' else ['sensor.irrigation_sensor_rainfall_today','sensor.irrigation_sensor_rainfall_yesterday','input_number.irrigation_rainfall_2','input_number.irrigation_rainfall_3','input_number.irrigation_rainfall_4']
        %}

        {% set check = namespace(ready=mode in ['on','off'] and is_number(days) and 0 <= days | float(-1) <= 4 and is_number(threshold)
        and threshold | float(0) > 0) %}

        {% for entity in sources[:(days | int(0)) + 1] %}
          {% if not ns.valid.get(entity,false) %}{% set check.ready=false %}{% endif %}
        {% endfor %}

        {% for day in range(1,(days | int(0))+1) %}
          {% set percent = states('input_number.irrigation_rainfall_percentage_' ~ day) %}
          {% if not is_number(percent) or not 0 <= percent | float(-1) <= 100 %}{% set check.ready=false %}{% endif
        %}
        {% endfor %}

        {{ check.ready }}

    action:
      - action: input_number.set_value
        data:
          entity_id: input_number.irrigation_rainfall_multiplier
          value: >
            {% if states('input_boolean.irrigation_rainfall_use_rolling_values') == 'on' %}
              {% set rain_0 = states('sensor.irrigation_sensor_rainfall_last_twenty_four_hours') | float(0) %}
              {% set rain_1 = states('sensor.irrigation_sensor_rainfall_between_24_and_48_hours_ago') | float(0) %}
              {% set rain_2 = states('sensor.irrigation_sensor_rainfall_between_48_and_72_hours_ago')  | float(0)%}
              {% set rain_3 = states('sensor.irrigation_sensor_rainfall_between_72_and_96_hours_ago')  | float(0)%}
              {% set rain_4 = states('sensor.irrigation_sensor_rainfall_between_96_and_120_hours_ago')  | float(0)%}
            {% else %}
              {% set rain_0 = states('sensor.irrigation_sensor_rainfall_today') | float(0) %}
              {% set rain_1 = states('sensor.irrigation_sensor_rainfall_yesterday') | float(0) %}
              {% set rain_2 = states('input_number.irrigation_rainfall_2')  | float(0)%}
              {% set rain_3 = states('input_number.irrigation_rainfall_3')  | float(0)%}
              {% set rain_4 = states('input_number.irrigation_rainfall_4')  | float(0)%}
            {% endif %}

            {% set percent_1 = states('input_number.irrigation_rainfall_percentage_1') | float(0) / 100 %}
            {% set percent_2 = states('input_number.irrigation_rainfall_percentage_2') | float(0) / 100 %}
            {% set percent_3 = states('input_number.irrigation_rainfall_percentage_3') | float(0) / 100 %}
            {% set percent_4 = states('input_number.irrigation_rainfall_percentage_4') | float(0) / 100 %}
            
            {% set rain_1 = rain_1 * percent_1 %}
            {% set rain_2 = rain_2 * percent_2 %}
            {% set rain_3 = rain_3 * percent_3 %}
            {% set rain_4 = rain_4 * percent_4 %}

            {% set days_used = states('input_number.irrigation_days_of_rainfall_history_used') | int(0) %}
            {% set threshold = states('input_number.irrigation_rainfall_threshold') | int(0) %}

            {% set rain_total = rain_0 %}
            {% if days_used >= 1 %}
              {% set rain_total = rain_total + rain_1 %}
            {% endif %}
            {% if days_used >= 2 %}
              {% set rain_total = rain_total + rain_2 %}
            {% endif %}
            {% if days_used >= 3 %}
              {% set rain_total = rain_total + rain_3 %}
            {% endif %}
            {% if days_used >= 4 %}
              {% set rain_total = rain_total + rain_4 %}
            {% endif %}

            {% if threshold <= 0 %}
              1
            {% else %}
              {% set multiplier = (1 - (rain_total / threshold)) | round(2) %}
              {% if multiplier <= 0 %}
                {% set multiplier = 0 %}
              {% endif %}
              {% if rain_total >= threshold %}
                0
              {% else %}
                {{ [[multiplier, 0] | max, 1] | min }}
              {% endif %}
            {% endif %}



# Date-indexed completed days; the original weighted formula above is unchanged.
script:
  irrigation_rainfall_update_calendar:
    alias: Irrigation Rainfall Update Calendar
    mode: queued
    max: 20
    sequence:
    - variables:
        records: >-
          {% set old = states('input_text.irrigation_rainfall_daily_records') | from_json([]) %}

          {% set yesterday = (now() - timedelta(days=1)).date().isoformat() %}

          {% set cutoff = (now() - timedelta(days=4)).date().isoformat() %}

          {% set name = states('input_text.irrigation_external_sensor_rainfall_yesterday') %}

          {% set source = states[name] if name is match('^[a-z_]+\.[a-z0-9_]+$') else none %}

          {% set fresh = is_number(states('sensor.irrigation_sensor_rainfall_yesterday')) and 0 <= states('sensor.irrigation_sensor_rainfall_yesterday')
          | float(-1) <= 10000 and source is not none and as_local(source.last_reported).date() == now().date()
          %}

          {% set ns = namespace(items=[]) %}

          {% if old is sequence and old is not string and old is not mapping %}
            {% for row in old %}
              {% if row is sequence and row is not string and row | length == 2 and row[0] is string and cutoff
          <= row[0] <= yesterday and not (fresh and row[0] == yesterday) and is_number(row[1]) and 0 <= row[1] |
          float(-1) <= 10000 %}
                {% set ns.items = ns.items + [row] %}
              {% endif %}
            {% endfor %}
          {% endif %}

          {% if fresh %}{% set ns.items = ns.items + [[yesterday,states('sensor.irrigation_sensor_rainfall_yesterday')
          | float(0) | round(1)]] %}{% endif %}

          {{ (ns.items | sort(attribute='0'))[-4:] }}
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_rainfall_daily_records
      data:
        value: '{{ records | to_json }}'
    - repeat:
        for_each:
        - 2
        - 3
        - 4
        sequence:
        - variables:
            values: '{{ records | selectattr(''0'',''eq'',(now() - timedelta(days=repeat.item)).date().isoformat())
              | map(attribute=1) | list }}'
        - if:
          - condition: template
            value_template: '{{ values | length > 0 and is_number(values[0]) }}'
          then:
          - action: input_number.set_value
            target:
              entity_id: '{{ ''input_number.irrigation_rainfall_'' ~ repeat.item }}'
            data:
              value: '{{ values[0] }}'
    - action: automation.trigger
      target:
        entity_id: automation.irrigation_rainfall_calculate_multiplier
      data:
        skip_condition: false
