
#================
#=== Automations
#================
automation:

  #========================================================================
  #=== Run a cycle if it is enabled and at the right time on the right day
  #=== Or a Manual run is requested
  #========================================================================
  - alias: Irrigation Triggered
    id: irrigation_triggered

    #==============
    #=== TRIGGERS
    #==============
    trigger:
      #=== Cycle 1 Start Time
      - trigger: time
        at: input_datetime.irrigation_cycle1_start_time
        id: cycle1

      #=== Cycle 2 Start Time
      - trigger: time
        at: input_datetime.irrigation_cycle2_start_time
        id: cycle2

      #=== Cycle 3 Manual Run
      - trigger: state
        entity_id: input_boolean.irrigation_cycle3_running
        to: 'on'
        id: cycle3

    #===============
    #=== CONDITIONS
    #===============
    #============
    #=== ACTIONS
    #============
    action:
      # Journal rejected schedules; Cycle 3 is owned by the worker.
      - variables:
          admission_reason: >
            {% if not is_state('input_boolean.irrigation_master_control_switch','on') %}
              master_off
            {% elif not (is_state('input_boolean.irrigation_cycle1_running','off') and
                         is_state('input_boolean.irrigation_cycle2_running','off') and
                         is_state('input_boolean.irrigation_cycle3_running','off')) %}
              cycle_busy
            {% elif not is_state('input_boolean.irrigation_' ~ trigger.id ~ '_schedule_enabled','on') %}
              schedule_disabled
            {% elif is_state('input_boolean.irrigation_ignore_schedule_if_raining','on') %}
              {{ 'raining_now' if is_state(states('input_text.irrigation_external_sensor_raining_now'),'on') else 'rain_unknown' }}
            {% else %}
              settings_unknown
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ trigger.id != 'cycle3' }}"
          - condition: not
            conditions:
              - condition: and
                conditions:
                  #=== Only continue if Master Control Switch is on
                  - condition: state
                    entity_id: input_boolean.irrigation_master_control_switch
                    state: 'on'

                  #=== Cycle 3 is triggered BY setting its running flag ON.
                  #=== Do not reject that very trigger; still reject overlapping cycles.
                  - condition: template
                    value_template: >
                      {{ is_state('input_boolean.irrigation_cycle1_running', 'off') and
                         is_state('input_boolean.irrigation_cycle2_running', 'off') and
                         (trigger.id == 'cycle3' or
                          is_state('input_boolean.irrigation_cycle3_running', 'off')) }}

                  #=== Check this cycle is enabled. NOTE: don't check this for cycle 3
                  - condition: template
                    value_template: >
                      {% if is_state('input_boolean.irrigation_' ~ trigger.id ~ '_schedule_enabled', 'on') or
                            trigger.id == 'cycle3' %}
                        True
                      {% else %}
                        False
                      {% endif %}

                  #=== Check it is not raining if that option is enabled. NOTE: don't check this for cycle 3
                  - condition: template
                    value_template: >
                      {% if is_state('input_boolean.irrigation_ignore_schedule_if_raining', 'off') or
                            trigger.id == 'cycle3' %}
                        True
                      {% elif states('input_boolean.irrigation_ignore_schedule_if_raining') == 'on' and
                              states(states('input_text.irrigation_external_sensor_raining_now')) == 'off' %}
                        True
                      {% else %}
                        False
                      {% endif %}

        then:
          - event: irrigation_decision
            continue_on_error: true
            event_data:
              reason: "{{ admission_reason | trim }}"
              cycle: "{{ trigger.id }}"
              rain_source: "{{ states('input_text.irrigation_external_sensor_raining_now') }}"
              rain_state: "{{ states(states('input_text.irrigation_external_sensor_raining_now')) }}"
          - stop: Scheduled attempt rejected
      #=== Only continue if Master Control Switch is on
      - condition: state
        entity_id: input_boolean.irrigation_master_control_switch
        state: 'on'

      #=== Cycle 3 is triggered BY setting its running flag ON.
      #=== Do not reject that very trigger; still reject overlapping cycles.
      - condition: template
        value_template: >
          {{ is_state('input_boolean.irrigation_cycle1_running', 'off') and
             is_state('input_boolean.irrigation_cycle2_running', 'off') and
             (trigger.id == 'cycle3' or
              is_state('input_boolean.irrigation_cycle3_running', 'off')) }}

      #=== Check this cycle is enabled. NOTE: don't check this for cycle 3
      - condition: template
        value_template: >
          {% if is_state('input_boolean.irrigation_' ~ trigger.id ~ '_schedule_enabled', 'on') or
                trigger.id == 'cycle3' %}
            True
          {% else %}
            False
          {% endif %}

      #=== Check it is not raining if that option is enabled. NOTE: don't check this for cycle 3
      - condition: template
        value_template: >
          {% if is_state('input_boolean.irrigation_ignore_schedule_if_raining', 'off') or
                trigger.id == 'cycle3' %}
            True
          {% elif states('input_boolean.irrigation_ignore_schedule_if_raining') == 'on' and
                  states(states('input_text.irrigation_external_sensor_raining_now')) == 'off' %}
            True
          {% else %}
            False
          {% endif %}

      #=== Check if there is an entity state to wait for (cycle 1 and 2)
      - if:
          - condition: template
            value_template: >
              {{ states('input_boolean.irrigation_' ~ trigger.id ~ '_wait_for_entity') == 'on' }}

        then:
          - variables:
              wait_for_entity_name: >
                {{ states('input_text.irrigation_' ~ trigger.id ~ '_wait_for_entity_name') }}
              wait_for_entity_state: >
                {{ states('input_text.irrigation_' ~ trigger.id ~ '_wait_for_entity_state') }}

          - event: irrigation_decision

            continue_on_error: true
            event_data:
              reason: "waiting_for_entity"
              cycle: "{{ trigger.id }}"
              source: "{{ wait_for_entity_name }}"
              expected: "{{ wait_for_entity_state }}"
          #=== Write To Log
          - action: script.irrigation_write_to_log
            data:
              log_event: CYCLE_WAITING_FOR_ENTITY
              cycle: >
                {{ trigger.id[-1] }}
              event_time: >
                {{ now() }}

          - wait_template: >
              {% if wait_for_entity_state.startswith('not') %}
                {% set chosen_states = wait_for_entity_state.replace('not in', '')
                                                            .replace('not', '')
                                                            .replace(' ','').split(',') %}
                {{ has_value(wait_for_entity_name) and states(wait_for_entity_name) not in chosen_states }}
              {% else %}
                {% set chosen_states = wait_for_entity_state.replace(' ','').split(',') %}
                {{ has_value(wait_for_entity_name) and states(wait_for_entity_name) in chosen_states }}
              {% endif %}
            timeout: >
              {{ states('input_number.irrigation_' ~ trigger.id ~ '_wait_for_entity_name_timeout_duration') }}

          #=== Write To Log
          - action: script.irrigation_write_to_log
            data:
              log_event: CYCLE_WAITING_FOR_ENTITY_COMPLETE
              cycle: >
                {{ trigger.id[-1] }}
              wait_completed: >
                {{ wait.completed }}
              event_time: >
                {{ now() }}

          #=== Check for timeout and stop if condition wasn't met and option set to not continue
          - if:
              - condition: template
                value_template: >
                  {% set timeout_continue = states('input_boolean.irrigation_' ~ trigger.id ~ '_wait_for_entity_name_timeout_continue') %}
                  {{ not wait.completed and timeout_continue != 'on' }}
            then:
              #=== Write To Log
              - action: script.irrigation_write_to_log
                data:
                  log_event: CYCLE_ABORTED_WAITING_FOR_ENTITY
                  cycle: >
                    {{ trigger.id[-1] }}
                  event_time: >
                    {{ now() }}

              #=== Notify
              - if:
                  - condition: template
                    value_template: "{{ has_value('script.irrigation_notify') }}"
                then:
                  - action: script.irrigation_notify
                    data:
                      show: true
                      tell: >
                        {{ states('input_text.irrigation_notification_user1_name') | lower }}
                      type: app_notification
                      title: Irrigation WARNING
                      message: >
                        {% set cycle_name =  states('input_text.irrigation_' ~ trigger.id ~ '_name') %}
                        Cycle {{ trigger.id[-1] }} ({{ cycle_name }}) Cycle ABORTED - Wait for entity state timed out.

                        Entity: {{ wait_for_entity_name }}

                        Waiting for state: {{ wait_for_entity_state }}

                        Current state: {{ states(wait_for_entity_name) }}


                        (See Irrigation Log)

              - event: irrigation_decision

                continue_on_error: true
                event_data:
                  reason: "wait_timeout"
                  cycle: "{{ trigger.id }}"
                  source: "{{ wait_for_entity_name }}"
                  expected: "{{ wait_for_entity_state }}"
                  observed: "{{ states(wait_for_entity_name) }}"
              #=== STOP processing (End the cycle)
              - stop: Wait for entity state failed

          #=== Log warning if continuing with an unknown state after (only possible when wait timeout is false)
          - if:
              - condition: template
                value_template: >
                  {{ not wait.completed and
                     not wait_for_entity_state.startswith('not') and
                     states(wait_for_entity_name) not in wait_for_entity_state }}
            then:
              #=== Write To Log
              - action: script.irrigation_write_to_log
                data:
                  log_event: CYCLE_CONTINUES_UNEXPECTED_STATE
                  cycle: >
                    {{ trigger.id[-1] }}
                  event_time: >
                    {{ now() }}

              #=== Notify
              - if:
                  - condition: template
                    value_template: "{{ has_value('script.irrigation_notify') }}"
                then:
                  - action: script.irrigation_notify
                    data:
                      show: true
                      tell: >
                        {{ states('input_text.irrigation_notification_user1_name') | lower }}
                      type: app_notification
                      title: Irrigation WARNING
                      message: >
                        {% set cycle_name =  states('input_text.irrigation_' ~ trigger.id ~ '_name') %}
                        Cycle {{ trigger.id[-1] }} ({{ cycle_name }}) Cycle continuing with unexpected state.

                        Entity: {{ wait_for_entity_name }}

                        Waiting For state: {{ wait_for_entity_state }}

                        Current state: {{ states(wait_for_entity_name) }}


                        (See Irrigation Log)


      # A schedule may have waited while another run began or STOP was requested.
      - if:
          - condition: not
            conditions:
            - condition: template
              value_template: >
                {{ is_state('input_boolean.irrigation_master_control_switch','on')
                   and is_state('input_boolean.irrigation_stop_in_progress','off')
                   and (trigger.id == 'cycle3' or
                        (is_state('input_boolean.irrigation_' ~ trigger.id ~ '_schedule_enabled','on') and
                         (is_state('input_boolean.irrigation_ignore_schedule_if_raining','off') or
                          (is_state('input_boolean.irrigation_ignore_schedule_if_raining','on') and
                           is_state(states('input_text.irrigation_external_sensor_raining_now'),'off'))) and
                         not is_state('script.irrigation_run_a_cycle','on') and
                         is_state('input_boolean.irrigation_cycle1_running','off') and
                         is_state('input_boolean.irrigation_cycle2_running','off') and
                         is_state('input_boolean.irrigation_cycle3_running','off'))) }}
        then:
          - event: irrigation_decision
            continue_on_error: true
            event_data:
              reason: "start_conditions_changed"
              cycle: "{{ trigger.id }}"
      - condition: template
        value_template: >
          {{ is_state('input_boolean.irrigation_master_control_switch','on')
             and is_state('input_boolean.irrigation_stop_in_progress','off')
             and (trigger.id == 'cycle3' or
                  (is_state('input_boolean.irrigation_' ~ trigger.id ~ '_schedule_enabled','on') and
                   (is_state('input_boolean.irrigation_ignore_schedule_if_raining','off') or
                    (is_state('input_boolean.irrigation_ignore_schedule_if_raining','on') and
                     is_state(states('input_text.irrigation_external_sensor_raining_now'),'off'))) and
                   not is_state('script.irrigation_run_a_cycle','on') and
                   is_state('input_boolean.irrigation_cycle1_running','off') and
                   is_state('input_boolean.irrigation_cycle2_running','off') and
                   is_state('input_boolean.irrigation_cycle3_running','off'))) }}

      #== Set the cycle to be running
      - action: homeassistant.turn_on
        data:
          entity_id: >
            input_boolean.irrigation_{{ trigger.id }}_running

      #=== Write To Log
      - action: script.irrigation_write_to_log
        data:
          log_event: CYCLE_STARTING
          cycle: >
            {{ trigger.id[-1] }}
          event_time: >
            {{ now() }}

